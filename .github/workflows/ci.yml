# Fast sanity check on every push/PR: no dependencies to install, so this is
# just a syntax check on every script plus the node:test suite in test/.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax-check scripts
        run: |
          for f in scripts/*.js; do
            node --check "$f"
          done

      - name: Run tests
        run: node --test "test/*.test.js"
